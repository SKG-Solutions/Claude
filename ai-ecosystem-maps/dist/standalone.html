<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>AI Ecosystem Maps</title>
<meta name="description" content="Two maps for business teams: what AI can produce across 21 kinds of work, and which model tier fits each task.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pan-and-zoom canvas for Map 1 (hub, five branches, 21 section circles,
   event thread along the foot) and scrolling poster pages for Map 2 and the notes.
   Colour: the RAISE spectrum on a navy ground. Logos keep their own colours on white plates. */
:root {
  color-scheme: dark;
  --navy: #05033A;
  --deep: #02011C;
  --indigo: #090C9B;
  --azure: #5286FE;
  --white: #FFFFFF;
  --ink: #FFFFFF;
  --ink-2: rgba(255, 255, 255, 0.66);
  --ink-3: rgba(255, 255, 255, 0.42);
  --hair: rgba(255, 255, 255, 0.12);
  --edge: #22252B;
  --panel: rgba(255, 255, 255, 0.06);
  --circle: #0A0950;
  --plate: #FFFFFF;
  --b-create: #5286FE;
  --b-find: #FFFFFF;
  --b-events: #9DB6FF;
  --b-work: #3B52E8;
  --b-build: #D3DEFF;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html, body { height: 100%; }
html { background: var(--navy); }
body {
  margin: 0;
  background: var(--navy);
  color: var(--ink);
  font: 400 15px/1.5 var(--font);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }

/* Top bar */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  display: flex; align-items: center; gap: 24px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px 10px;
  background: rgba(5, 3, 58, 0.82);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--hair);
}
.bar-name { font-weight: 600; font-style: italic; font-size: 17px; letter-spacing: -0.04em; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.bar-mark { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 70%, var(--azure), var(--indigo) 60%, var(--navy)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab {
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  border: 0; background: transparent; padding: 8px 12px; border-radius: 8px;
  color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer;
  transition: color 140ms var(--ease), background 140ms var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: rgba(255,255,255,0.1); }
.tab-n { font-family: var(--mono); font-size: 11px; color: var(--azure); }

main { height: 100%; }
.view[hidden] { display: none !important; }

/* Map 1 canvas */
.view-map { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 45%, #0B0A5C 0%, var(--navy) 55%, var(--deep) 100%); }
.viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.viewport.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world > svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.map-tools {
  position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 10;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none;
}
.map-tools > * { pointer-events: auto; }
.find { display: flex; gap: 6px; flex: 0 1 340px; min-width: 0; }
.find input {
  flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18); background: rgba(5,3,58,0.88); color: var(--ink);
  font: 500 14px var(--font); backdrop-filter: blur(14px);
}
.find input::placeholder { color: var(--ink-3); }
.find-clear, .zoom button, .jump button {
  height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.18); background: rgba(5,3,58,0.88); backdrop-filter: blur(14px);
  font-size: 14px; font-weight: 500;
  transition: background 140ms var(--ease), border-color 140ms var(--ease);
}
.find-clear:hover, .zoom button:hover, .jump button:hover { background: rgba(9,12,155,0.9); border-color: rgba(255,255,255,0.4); }
.zoom { display: flex; gap: 6px; }
.zoom button { min-width: 44px; font-size: 18px; }
.zoom #zoom-fit { font-size: 14px; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.jump button { display: flex; align-items: center; gap: 8px; }
.jump i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.hint {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px); transform: translateX(-50%);
  margin: 0; padding: 8px 14px; border-radius: 8px; background: rgba(5,3,58,0.85); border: 1px solid var(--hair);
  font-size: 13px; color: var(--ink-2); white-space: nowrap; pointer-events: none;
  transition: opacity 480ms var(--ease);
}
.hint.gone { opacity: 0; }

/* Canvas elements (world units) */
.w-abs { position: absolute; }
.sec-hit { position: absolute; border-radius: 50%; cursor: zoom-in; }
.eyebrow { position: absolute; font: 500 13px/16px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; text-align: center; }
.pill {
  position: absolute; height: 30px; padding: 0 13px; border-radius: 15px;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.28); font: 500 15px/1 var(--font); color: var(--ink);
}
.pill b { font: 500 12px/1 var(--mono); color: var(--azure); }
.task { position: absolute; text-align: center; font: 400 15px/21px var(--font); color: var(--ink-2); }
.caveat { position: absolute; text-align: center; font: italic 500 13.5px/19px var(--font); color: var(--ink-3); }
.glabel { position: absolute; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 12px/16px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--azure); white-space: nowrap; }

.chip {
  position: absolute; width: 128px; height: 100px; padding: 0; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.plate {
  width: 112px; height: 46px; border-radius: 8px; background: var(--plate);
  display: flex; align-items: center; justify-content: center; padding: 7px 10px; box-sizing: border-box;
  transition: box-shadow 240ms var(--ease);
}
.plate img { max-width: 100%; max-height: 100%; display: block; }
.plate.missing { background: transparent; border: 1.5px dashed rgba(255,255,255,0.5); color: var(--ink-2); font: 500 15px/1 var(--mono); letter-spacing: 0.06em; }
.chip:hover .plate, .chip:focus-visible .plate { box-shadow: 0 0 0 3px var(--azure); }
.chip.hit .plate { box-shadow: 0 0 0 4px var(--white), 0 0 0 9px var(--azure); }
.cname { margin-top: 7px; font: 600 14px/17px var(--font); color: var(--ink); max-width: 128px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ccomp { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 2px; font: 400 11.5px/15px var(--mono); color: var(--ink-2); max-width: 128px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccomp svg { flex: none; }

.branch-node {
  position: absolute; border-radius: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: zoom-in;
}
.branch-node .bn-name { font: italic 600 92px/1 var(--font); letter-spacing: -0.045em; white-space: nowrap; }
.branch-node .bn-meta { margin-top: 14px; font: 500 21px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; }

.hub-text { position: absolute; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hub-ai { font: italic 600 230px/0.9 var(--font); letter-spacing: -0.05em; }
.hub-line { margin-top: 18px; font: italic 600 50px/1.08 var(--font); letter-spacing: -0.04em; text-wrap: balance; }
.hub-meta { margin-top: 26px; font: 500 15px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }

.title-block { position: absolute; }
.tb-eyebrow { font: 500 26px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--azure); }
.tb-title { margin-top: 26px; font: italic 600 230px/0.92 var(--font); letter-spacing: -0.05em; }
.tb-lede { margin-top: 40px; max-width: 2000px; font: 400 46px/1.3 var(--font); color: var(--ink-2); letter-spacing: -0.02em; }
.tb-stats { margin-top: 48px; display: flex; gap: 84px; }
.tb-stats div { font: 500 22px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.tb-stats b { display: block; font: italic 600 96px/1 var(--font); letter-spacing: -0.04em; color: var(--ink); text-transform: none; margin-bottom: 8px; }

.legend { position: absolute; padding: 40px 44px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.03); box-sizing: border-box; }
.lg-h { font: 500 15px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 18px; }
.lg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 40px; margin-bottom: 34px; }
.lg-row { display: flex; align-items: center; gap: 14px; font: 500 20px/1.3 var(--font); }
.lg-row small { display: block; font: 400 15px/1.35 var(--font); color: var(--ink-2); }
.lg-sw { width: 30px; height: 30px; border-radius: 50%; flex: none; box-sizing: border-box; }
.lg-plate { width: 64px; height: 30px; border-radius: 6px; flex: none; background: #fff; box-sizing: border-box; }
.lg-plate.missing { background: transparent; border: 1.5px dashed rgba(255,255,255,0.5); }
.lg-note { font: 400 16px/1.45 var(--font); color: var(--ink-2); margin: 0; max-width: 980px; }

.thread-title { position: absolute; }
.thread-title .tb-eyebrow { font-size: 26px; }
.thread-title h3 { margin: 22px 0 0; font: italic 600 120px/1 var(--font); letter-spacing: -0.04em; }
.thread-title p { margin: 26px 0 0; font: 400 38px/1.35 var(--font); color: var(--ink-2); max-width: 2400px; }
.stage { position: absolute; text-align: center; cursor: pointer; }
.stage-dot { width: 160px; height: 160px; margin: 0 auto; border-radius: 50%; background: var(--navy); border: 6px solid var(--white); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font: italic 600 76px/1 var(--font); transition: background 240ms var(--ease); }
.stage:hover .stage-dot, .stage.on .stage-dot { background: var(--azure); }
.stage-name { margin-top: 22px; font: italic 600 60px/1.05 var(--font); letter-spacing: -0.03em; }
.stage-secs { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.stage-secs span { font: 500 22px/1.25 var(--font); color: var(--ink-2); white-space: nowrap; }
.stage-secs b { font: 500 19px/1 var(--mono); margin-right: 6px; }

.world.focus-thread .sec-group { opacity: 0.25; transition: opacity 240ms var(--ease); }
.world.focus-thread .sec-group.lit { opacity: 1; }
.sec-group { transition: opacity 240ms var(--ease); }
#links path.tlink { transition: stroke-opacity 240ms var(--ease), stroke-width 240ms var(--ease); }

/* Popover */
.pop {
  position: absolute; z-index: 30; width: min(340px, calc(100vw - 32px)); box-sizing: border-box;
  padding: 18px; border-radius: 16px; background: rgba(5,3,58,0.96); border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8); backdrop-filter: blur(18px);
}
.pop .plate { width: 140px; height: 56px; }
.pop h4 { margin: 14px 0 2px; font: italic 600 24px/1.15 var(--font); letter-spacing: -0.03em; }
.pop .p-co { font: 400 13px/1.4 var(--mono); color: var(--ink-2); }
.pop dl { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.pop dt { color: var(--ink-3); font: 500 11.5px/1.6 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.pop dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.pop a { color: var(--azure); }
.pop .p-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--hair); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }

/* Poster pages (Map 2, notes) */
.view-page { padding: calc(env(safe-area-inset-top, 0px) + 92px) 16px 80px; }
.page { max-width: 1240px; margin: 0 auto; }
.p-eyebrow { font: 500 13px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--azure); }
.p-title { margin: 14px 0 0; font: italic 600 clamp(40px, 6.4vw, 76px)/0.98 var(--font); letter-spacing: -0.045em; text-wrap: balance; }
.p-lede { margin: 22px 0 0; max-width: 62ch; font-size: clamp(17px, 1.9vw, 21px); line-height: 1.45; color: var(--ink-2); }
.p-h { margin: 72px 0 6px; font: italic 600 clamp(28px, 3.4vw, 40px)/1.05 var(--font); letter-spacing: -0.04em; text-wrap: balance; }
.p-sub { margin: 0 0 22px; color: var(--ink-2); max-width: 70ch; }

.spectrum { margin-top: 48px; }
.spec-bar { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--indigo) 0%, var(--azure) 50%, var(--white) 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
.spec-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; font: 500 12px/1.3 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.spec-ends span:last-child { text-align: right; }

.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
.tier { border-radius: 16px; border: 1px solid var(--edge); background: rgba(255,255,255,0.03); padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; position: relative; }
.tier::before { content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--tc); }
.tier-k { font: 500 12px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.tier h3 { margin: 6px 0 0; font: italic 600 40px/1 var(--font); letter-spacing: -0.04em; }
.tier-use { margin: 0; font-size: 16px; line-height: 1.45; }
.tier ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tier li { padding-left: 18px; position: relative; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; }
.tier li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.t-label { font: 500 11.5px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.models { display: flex; flex-direction: column; gap: 8px; }
.model { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); }
.model .plate { width: 40px; height: 40px; padding: 7px; border-radius: 8px; }
.model b { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.model small { display: block; font: 400 12px/1.35 var(--mono); color: var(--ink-2); }
.brief { margin: 0; padding: 14px; border-radius: 10px; border: 1px solid var(--hair); font-size: 14.5px; line-height: 1.45; }
.brief b { font-weight: 600; }
.meters { display: flex; gap: 22px; }
.meter { font: 500 11.5px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.meter span { display: flex; gap: 4px; margin-top: 8px; }
.meter i { width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); }
.meter i.on { background: var(--tc); }

.factors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.factor { padding: 18px; border-radius: 12px; border: 1px solid var(--edge); min-width: 0; }
.factor h4 { margin: 0; font: 600 18px/1.2 var(--font); }
.factor p { margin: 8px 0 14px; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
.factor .dir { display: flex; align-items: center; gap: 8px; font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--azure); }

.router { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 0 28px; align-items: stretch; }
.router-start { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; border-radius: 16px; background: radial-gradient(circle at 50% 120%, var(--azure), var(--indigo) 55%, var(--navy)); border: 1px solid rgba(255,255,255,0.3); font: italic 600 28px/1.1 var(--font); letter-spacing: -0.03em; position: relative; }
.routes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative; }
.route { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 18px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,0.03); min-width: 0; }
.route-n { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--azure); display: flex; align-items: center; justify-content: center; font: 500 13px/1 var(--mono); color: var(--azure); }
.route h4 { margin: 0; font: 600 17px/1.25 var(--font); }
.route p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.45; }
.route .goto { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.goto button, .goto a { border: 1px solid rgba(255,255,255,0.22); background: transparent; border-radius: 15px; padding: 5px 11px; font: 500 12.5px/1 var(--font); color: var(--ink); cursor: pointer; text-decoration: none; }
.goto button:hover { border-color: var(--azure); }
.goto b { font: 500 11px/1 var(--mono); color: var(--azure); margin-right: 5px; }
.watch { margin: 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; max-width: 80ch; }

.n-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 30px; }
.n-stat { padding: 20px; border-radius: 12px; border: 1px solid var(--edge); }
.n-stat b { display: block; font: italic 600 44px/1 var(--font); letter-spacing: -0.04em; }
.n-stat span { display: block; margin-top: 8px; color: var(--ink-2); font-size: 14px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--edge); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 500 11.5px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; color: var(--ink-2); }
td:first-child { color: var(--ink); }
tr:last-child td { border-bottom: 0; }
td a { color: var(--azure); overflow-wrap: anywhere; }
.tag { display: inline-block; padding: 3px 8px; border-radius: 10px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.06em; border: 1px solid var(--hair); white-space: nowrap; }
.tag.official { border-color: var(--azure); color: var(--azure); }
.missing-list { columns: 4 180px; column-gap: 24px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--ink-2); }
.missing-list li { break-inside: avoid; padding: 3px 0; }
.missing-list b { color: var(--ink); font-weight: 600; }

@media (max-width: 900px) {
  .tiers, .factors { grid-template-columns: minmax(0, 1fr); }
  .router { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .routes { grid-template-columns: minmax(0, 1fr); }
  .n-grid { grid-template-columns: minmax(0, 1fr); }
  .bar { gap: 12px; padding-left: 12px; padding-right: 12px; }
  .bar-name { display: none; }
  .jump { display: none; }
  .hint { white-space: normal; width: calc(100vw - 64px); text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Poster export: no chrome */
body.poster .bar, body.poster .map-tools, body.poster .hint, body.poster .pop { display: none !important; }
body.poster .view-map { position: static; }
body.poster .viewport { position: static; overflow: visible; }
body.poster .view-page { padding-top: 64px; }

</style>

<header class="bar" id="bar">

<script>
(() => {
  'use strict';

  /* ---------- helpers ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (q, r = document) => r.querySelector(q);
  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) e.style.setProperty(sk, sv); else e.style[sk] = sv; } }
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c);
    return e;
  }
  function s(tag, attrs = {}, ...kids) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
    for (const c of kids.flat()) if (c != null) e.append(c);
    return e;
  }
  const pad2 = (n) => String(n).padStart(2, '0');
  const rad = (d) => (d * Math.PI) / 180;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COLOR = { create: '#5286FE', find: '#FFFFFF', events: '#9DB6FF', work: '#3B52E8', build: '#D3DEFF' };
  const ON = { create: '#FFFFFF', find: '#05033A', events: '#05033A', work: '#FFFFFF', build: '#05033A' };
  const BR = Object.fromEntries(DATA.branches.map((b) => [b.id, b]));
  const SEC = Object.fromEntries(DATA.sections.map((x) => [x.n, x]));
  const TYPE = DATA.types;

  function typeMark(t, size = 10) {
    const c = '#5286FE';
    const shapes = {
      M: s('path', { d: 'M5 0.4 L9.6 5 L5 9.6 L0.4 5Z', fill: c }),
      A: s('circle', { cx: 5, cy: 5, r: 4.4, fill: c }),
      C: s('rect', { x: 0.9, y: 0.9, width: 8.2, height: 8.2, rx: 1, fill: c }),
      P: s('circle', { cx: 5, cy: 5, r: 3.7, fill: 'none', stroke: c, 'stroke-width': 1.7 }),
      X: s('path', { d: 'M5 0.6 L9.7 9.2 L0.3 9.2Z', fill: c }),
    };
    return s('svg', { width: size, height: size, viewBox: '0 0 10 10', 'aria-hidden': 'true' }, shapes[t]);
  }
  function initials(name) {
    const w = name.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
    return (w.length > 1 ? w[0][0] + w[1][0] : name.replace(/[^A-Za-z0-9]/g, '').slice(0, 2)).toUpperCase();
  }
  function plate(tool) {
    const src = DATA.logos[tool.logo];
    if (src) return h('span', { class: 'plate' }, h('img', { src, alt: '', draggable: 'false' }));
    return h('span', { class: 'plate missing', title: 'Official logo not yet sourced' }, initials(tool.company || tool.name));
  }

  /* ---------- text measurement ---------- */
  const mctx = document.createElement('canvas').getContext('2d');
  const FONT = {
    pill: '500 15px "Plus Jakarta Sans"',
    num: '500 12px "Geist Mono"',
    task: '400 15px "Plus Jakarta Sans"',
    caveat: 'italic 500 13.5px "Plus Jakarta Sans"',
    eyebrow: '500 13px "Geist Mono"',
    glabel: '500 12px "Geist Mono"',
  };
  function tw(text, font, tracking = 0) {
    mctx.font = font;
    return mctx.measureText(text).width + text.length * tracking;
  }
  function wrap(text, font, max) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (tw(t, font) <= max) line = t;
      else {
        if (!line) return null;
        lines.push(line);
        line = w;
        if (tw(w, font) > max) return null;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  /* ---------- section circle layout ---------- */
  const CW = 128, CH = 100, GX = 12, GY = 14, PAD_T = 60, PAD_B = 48, INSET = 30, SIDE = 10;
  const chordAt = (R, y) => { const r = R - INSET; return y * y >= r * r ? 0 : 2 * Math.sqrt(r * r - y * y); };
  const chord = (R, y0, y1) => Math.min(chordAt(R, y0), chordAt(R, y1));

  function attempt(sec, R, offset) {
    const items = [];
    let y = -R + PAD_T + offset;
    const eyebrow = (text) => {
      const w = tw(text.toUpperCase(), FONT.eyebrow, 13 * 0.16);
      if (chord(R, y, y + 16) - 2 * SIDE < w) return false;
      items.push({ k: 'eyebrow', text, y, w });
      y += 16 + 12;
      return true;
    };
    if (!eyebrow(sec.workflow ? 'Workflow' : 'AI can produce')) return null;
    const pills = sec.produces.map((t, i) => {
      const num = sec.workflow ? String(i + 1) : null;
      return { t, num, w: 28 + tw(t, FONT.pill) + (num ? tw(num, FONT.num) + 7 : 0) };
    });
    let i = 0;
    while (i < pills.length) {
      const avail = chord(R, y, y + 30) - 2 * SIDE;
      const row = [];
      let w = 0;
      while (i < pills.length) {
        const add = pills[i].w + (row.length ? 8 : 0);
        if (w + add > avail) break;
        row.push(pills[i]); w += add; i++;
      }
      if (!row.length) return null;
      let x = -w / 2;
      for (const p of row) { items.push({ k: 'pill', ...p, x, y }); x += p.w + 8; }
      y += 38;
    }
    y += 16;
    for (const g of sec.groups) {
      if (g.label) {
        const w = tw(g.label.toUpperCase(), FONT.glabel, 12 * 0.14) + 24;
        if (chord(R, y, y + 16) - 2 * SIDE < w) return null;
        items.push({ k: 'glabel', text: g.label, y, w });
        y += 16 + 12;
      }
      const rest = g.tools.slice();
      while (rest.length) {
        const avail = chord(R, y, y + CH) - 2 * SIDE;
        let n = Math.floor((avail + GX) / (CW + GX));
        if (n < 1) return null;
        n = Math.min(n, rest.length);
        if (rest.length - n === 1 && n >= 3) n -= 1;
        const row = rest.splice(0, n);
        let x = -(n * CW + (n - 1) * GX) / 2;
        for (const t of row) { items.push({ k: 'chip', t, x, y }); x += CW + GX; }
        y += CH + GY;
      }
      y += 10;
    }
    y += 8;
    if (!eyebrow('Try')) return null;
    for (const task of sec.tasks) {
      const lines = wrap(task, FONT.task, Math.min(560, chord(R, y, y + 42) - 2 * SIDE - 24));
      if (!lines) return null;
      for (const ln of lines) {
        if (chord(R, y, y + 21) - 2 * SIDE < tw(ln, FONT.task)) return null;
        items.push({ k: 'task', text: ln, y });
        y += 21;
      }
      y += 7;
    }
    if (sec.caveat) {
      y += 6;
      const lines = wrap(sec.caveat, FONT.caveat, Math.min(540, chord(R, y, y + 38) - 2 * SIDE - 30));
      if (!lines) return null;
      for (const ln of lines) {
        if (chord(R, y, y + 19) - 2 * SIDE < tw(ln, FONT.caveat)) return null;
        items.push({ k: 'caveat', text: ln, y });
        y += 19;
      }
    }
    if (y > R - PAD_B) return null;
    return { R, items, end: y };
  }

  function layoutSection(sec) {
    for (let R = 300; R <= 1400; R += 6) {
      const res = attempt(sec, R, 0);
      if (!res) continue;
      const slack = R - PAD_B - res.end;
      for (let off = Math.floor(slack / 2); off > 0; off -= 4) {
        const centred = attempt(sec, R, off);
        if (centred) return centred;
      }
      return res;
    }
    throw new Error('Section ' + sec.n + ' does not fit');
  }

  /* ---------- packing ---------- */
  // Each branch owns an angular sector around the hub, sized by its number of
  // sections. Sections get a slot on one or two rings inside their sector, then
  // a collision pass settles overlaps. X is stretched so the map runs landscape.
  const RH = 470;
  const ARC = 118;
  const SX = 1.75;
  const LABEL_D = RH + 600;

  function pack(blocks) {
    const byBranch = {};
    for (const bl of blocks) (byBranch[bl.sec.branch] ||= []).push(bl);
    const order = ['create', 'find', 'events', 'work', 'build'];
    const total = blocks.length;
    let a = 104;
    const sector = {};
    for (const b of order) {
      const span = (360 * byBranch[b].length) / total;
      sector[b] = { a0: a, a1: a + span, mid: a + span / 2 };
      a += span;
    }
    const nodes = [{ id: 'hub', x: 0, y: 0, r: RH + 80, m: Infinity }];
    const labels = {};

  }

  const pointers = new Map();
  let drag = null, moved = false, pinch = null;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; }
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s };
      viewport.setPointerCapture(e.pointerId);
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = viewport.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, (pinch.s * d / pinch.d) / view.s);
      moved = true;
      return;
    }
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!moved && Math.hypot(dx, dy) > 5) {
        moved = true;
        viewport.classList.add('dragging');
        viewport.setPointerCapture(e.pointerId);
        closePop();
        hideHint();
      }
      if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { drag = null; viewport.classList.remove('dragging'); }
  };
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('click', (e) => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; return; }
    if (e.target.closest('.chip, .stage')) return;
    closePop();
    const r = viewport.getBoundingClientRect();
    const p = toWorld(e.clientX - r.left, e.clientY - r.top);
    const bn = e.target.closest('.branch-node');
    if (bn) { const g = branchGeom[bn.dataset.branch]; animateTo(target(g.x0, g.y0, g.x1, g.y1)); return; }
    for (const [n, g] of Object.entries(sectionGeom)) {
      if (Math.hypot(p.x - g.cx, p.y - g.cy) <= g.R + 70) { focusSection(+n); return; }
    }
    if (activeStage !== null) toggleStage(activeStage);
  }, true);
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    const k = e.ctrlKey ? 0.012 : 0.0016;
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * k));
    closePop();
    hideHint();
  }, { passive: false });
  viewport.addEventListener('keydown', (e) => {
    const c = { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2 };
    if (e.key === '+' || e.key === '=') zoomAt(c.x, c.y, 1.25);
    else if (e.key === '-') zoomAt(c.x, c.y, 0.8);
    else if (e.key === '0') fitAll();
    else if (e.key.startsWith('Arrow')) {
      const d = 80;
      view.x += e.key === 'ArrowLeft' ? d : e.key === 'ArrowRight' ? -d : 0;
      view.y += e.key === 'ArrowUp' ? d : e.key === 'ArrowDown' ? -d : 0;
      apply();
    } else return;
    e.preventDefault();
  });
  $('#zoom-in').addEventListener('click', () => closePop() || zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.4));
  $('#zoom-out').addEventListener('click', () => closePop() || zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.7));
  $('#zoom-fit').addEventListener('click', () => fitAll());
  window.addEventListener('resize', () => { if (!document.body.classList.contains('poster') && !$('#map1').hidden) fitAll(true); });
  let hintTimer = null;
  function hideHint() { $('#hint').classList.add('gone'); }

  /* ---------- popover ---------- */
  const pop = $('#pop');
  let popChip = null;
  function openPop(chip) {
    const t = chip._tool;
    if (popChip === chip && !pop.hidden) { closePop(); return; }
    popChip = chip;
    const meta = DATA.logoMeta[t.logo] || {};
    const also = DATA.sections.filter((x) => x.n !== chip._sec && x.groups.some((g) => g.tools.some((y) => y.name === t.name))).map((x) => x.n);
    const sec = SEC[chip._sec];
    const group = sec.groups.find((g) => g.tools.includes(t));
    pop.replaceChildren(
      h('button', { class: 'p-close', type: 'button', 'aria-label': 'Close', onclick: closePop }, '×'),
      plate(t),
      h('h4', { text: t.name }),
      h('div', { class: 'p-co', text: t.company }),
      h('dl', {},
        h('dt', { text: 'Type' }), h('dd', {}, TYPE[t.type] + (group && group.label ? ` · ${group.label.replace(/^Platforms with /, '').replace(/^AI-first tools$/, 'AI-first')}` : '')),
        h('dt', { text: 'Section' }), h('dd', { text: `${pad2(sec.n)} ${sec.title}` }),
        also.length ? [h('dt', { text: 'Also in' }), h('dd', { text: also.map((n) => `${pad2(n)} ${SEC[n].title}`).join('; ') })] : null,
        t.note ? [h('dt', { text: 'Note' }), h('dd', { text: t.note })] : null,
        t.domain ? [h('dt', { text: 'Website' }), h('dd', {}, h('a', { href: 'https://' + t.domain, target: '_blank', rel: 'noopener', text: t.domain }))] : null,
        h('dt', { text: 'Logo' }), h('dd', { text: meta.file ? meta.source : 'Not yet sourced' })));
    pop.hidden = false;
    const r = chip.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.right + 12, y = r.top;
    if (x + pw > window.innerWidth - 12) x = r.left - pw - 12;
    if (x < 12) x = Math.max(12, Math.min(window.innerWidth - pw - 12, r.left));
    y = Math.max(76, Math.min(window.innerHeight - ph - 12, y));
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
  }
  function closePop() { pop.hidden = true; popChip = null; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePop(); if (activeStage !== null) toggleStage(activeStage); } });

  /* ---------- search ---------- */
  function setupSearch() {
    const input = $('#find-input'), list = $('#find-list'), clear = $('#find-clear');
    const names = new Set();
    for (const sec of DATA.sections) for (const g of sec.groups) for (const t of g.tools) { names.add(t.name); names.add(t.company); }
    [...names].sort((a, b) => a.localeCompare(b)).forEach((n) => list.append(h('option', { value: n })));
    const run = () => {
      const q = input.value.trim().toLowerCase();
      world.querySelectorAll('.chip.hit').forEach((c) => c.classList.remove('hit'));
      clear.hidden = !q;
      if (!q) return;
      const all = world.querySelectorAll('.chip');
      let hits = [...all].filter((c) => c._tool.name.toLowerCase() === q || c._tool.company.toLowerCase() === q);
      if (!hits.length) hits = [...all].filter((c) => c._tool.name.toLowerCase().includes(q) || c._tool.company.toLowerCase().includes(q));
      if (!hits.length) { input.setCustomValidity('No tool or company matches'); input.reportValidity(); return; }
      input.setCustomValidity('');
      hits.forEach((c) => c.classList.add('hit'));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const c of hits) { x0 = Math.min(x0, c._wx); y0 = Math.min(y0, c._wy); x1 = Math.max(x1, c._wx + CW); y1 = Math.max(y1, c._wy + CH); }
      const padW = 220;
      animateTo(target(x0 - padW, y0 - padW, x1 + padW, y1 + padW, 1.4));
      hideHint();
    };
    $('#find').addEventListener('submit', (e) => { e.preventDefault(); run(); });
    input.addEventListener('change', run);
    input.addEventListener('input', () => input.setCustomValidity(''));
    clear.addEventListener('click', () => { input.value = ''; run(); fitAll(); });
    const jump = $('#jump');
    for (const b of DATA.branches) {
      jump.append(h('button', { type: 'button', onclick: () => { const g = branchGeom[b.id]; animateTo(target(g.x0, g.y0, g.x1, g.y1)); hideHint(); } },
        h('i', { style: { background: COLOR[b.id] } }), b.label));
    }
  }

  /* ---------- Map 2 ---------- */
  function buildMap2() {
    const M2 = DATA.models;
    const tc = { fast: '#5286FE', balanced: '#9DB6FF', deep: '#FFFFFF' };
    const meter = (label, n, c) => h('div', { class: 'meter' }, label, h('span', {}, [1, 2, 3].map((i) => h('i', { class: i <= n ? 'on' : '' }))));
    const goto = (nums) => nums.length ? h('div', { class: 'goto' }, nums.map((n) => h('button', { type: 'button', onclick: () => { show('map1'); setTimeout(() => focusSection(n), 60); } }, h('b', { text: pad2(n) }), SEC[n].title))) : null;
    const page = h('div', { class: 'page' },
      h('div', { class: 'p-eyebrow', text: `Map 2 of 2 · Checked ${DATA.researchDate}` }),
      h('h1', { class: 'p-title', text: 'Choosing a model for the task' }),
      h('p', { class: 'p-lede', text: M2.intro }),
      h('div', { class: 'spectrum', role: 'img', 'aria-label': 'Spectrum from fast and repetitive work to complex, high-judgment work' },
        h('div', { class: 'spec-bar' }),
        h('div', { class: 'spec-ends' }, h('span', { text: 'Fast and repetitive' }), h('span', { text: 'Complex and high-judgment' }))),
      h('div', { class: 'tiers' }, M2.tiers.map((t) => h('article', { class: 'tier', style: { '--tc': tc[t.id] } },
        h('div', {}, h('div', { class: 'tier-k', text: t.kicker }), h('h3', { text: t.name })),
        h('p', { class: 'tier-use', text: t.use }),
        h('div', {}, h('div', { class: 't-label', text: 'Event and business examples' }), h('ul', {}, t.tasks.map((x) => h('li', { text: x })))),
        h('div', {}, h('div', { class: 't-label', text: 'Current models at this tier' }),
          h('div', { class: 'models' }, t.models.map(([logo, co, name, note]) => h('div', { class: 'model' },
            plate({ logo, company: co, name }),
            h('div', {}, h('b', { text: name }), h('small', { text: `${co} · ${note}` })))))),
        h('p', { class: 'brief' }, h('b', { text: 'Brief it: ' }), t.brief),
        h('div', { class: 'meters' }, meter('Speed', t.speed), meter('Cost per task', t.cost))))),
      h('h2', { class: 'p-h', text: 'Five things that move a task along the spectrum' }),
      h('p', { class: 'p-sub', text: 'Start in the middle and adjust. Most real tasks mix tiers: a fast model sorts the pile, a deep model writes the judgment.' }),
      h('div', { class: 'factors' }, M2.factors.map(([name, text, dir]) => h('div', { class: 'factor' },
        h('h4', { text: name }), h('p', { text: text }),
        h('div', { class: 'dir' }, s('svg', { width: 26, height: 12, viewBox: '0 0 26 12', 'aria-hidden': 'true' },
          s('path', { d: dir === 'deep' ? 'M1 6 H23 M18 1.5 L23.5 6 L18 10.5' : 'M25 6 H3 M8 1.5 L2.5 6 L8 10.5', stroke: '#5286FE', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })),
          dir === 'deep' ? 'Toward deep' : 'Toward fast')))),
      h('h2', { class: 'p-h', text: 'Route the task' }),
      h('p', { class: 'p-sub', text: 'Ask what the task needs before choosing a model. Some needs are met by adding retrieval, a specialist tool or a supervised workflow, not by a bigger model.' }),
      h('div', { class: 'router' },
        h('div', { class: 'router-start', text: 'What does the task need?' }),
        h('div', { class: 'routes' }, M2.routes.map(([need, action, nums, tier], i) => h('div', { class: 'route' },
          h('div', { class: 'route-n', text: String(i + 1) }),
          h('div', {}, h('h4', { text: need }), h('p', { text: action }), goto(nums)))))),
      h('h2', { class: 'p-h', text: 'Watch list' }),
      h('ul', { class: 'watch' }, M2.watch.map((w) => h('li', { text: w }))),
      h('p', { class: 'p-sub', style: { marginTop: '28px' }, text: 'Model names change every few weeks. Anthropic names were checked on its own pages; OpenAI and Google names were checked against dated coverage and Google developer documentation. Sources are listed under Sources and notes.' }));
    $('#map2').append(page);
  }

  /* ---------- notes ---------- */
  function buildNotes() {
    const metas = Object.entries(DATA.logoMeta);
    const missing = metas.filter(([, m]) => !m.file);
    const official = metas.filter(([, m]) => m.status === 'official');
    const library = metas.filter(([, m]) => m.status === 'library');
    const changes = [];
    for (const sec of DATA.sections) {
      for (const [name, why] of sec.replaced || []) changes.push([name, `${pad2(sec.n)} ${sec.title}`, why]);
      for (const g of sec.groups) for (const t of g.tools) if (t.note) changes.push([t.name, `${pad2(sec.n)} ${sec.title}`, t.note]);
    }
    const seen = new Set();
    const uniqueChanges = changes.filter(([a, , c]) => { const k = a + c; if (seen.has(k)) return false; seen.add(k); return true; });
    const groups = {};
    for (const src of DATA.sources) (groups[src.topic] ||= []).push(src);
    const page = h('div', { class: 'page' },
      h('div', { class: 'p-eyebrow', text: `Research date ${DATA.researchDate}` }),
      h('h1', { class: 'p-title', text: 'Sources and notes' }),
      h('p', { class: 'p-lede', text: 'How the inventory was checked, what changed from the starting lists, where every logo came from and which logos still need official files.' }),
      h('div', { class: 'n-grid' },
        h('div', { class: 'n-stat' }, h('b', { text: String(DATA.stats.entries) }), h('span', { text: `tool entries across ${DATA.sections.length} sections; ${DATA.stats.unique} distinct tools` })),
        h('div', { class: 'n-stat' }, h('b', { text: String(official.length + library.length) }), h('span', { text: `brands shown with logo artwork; ${official.length} are official files supplied to RAISE` })),
        h('div', { class: 'n-stat' }, h('b', { text: String(missing.length) }), h('span', { text: 'brands still need an official logo file' }))),
      h('h2', { class: 'p-h', text: 'Method' }),
      h('ul', { class: 'watch' },
        h('li', { text: 'Each starting list was treated as a set of examples. Names, ownership and AI features were checked against company pages, release notes and dated coverage in early October 2026.' }),
        h('li', { text: 'Discontinued products were replaced with current equivalents; every section keeps at least ten tools.' }),
        h('li', { text: 'Sections 14, 20 and 21 separate specialist platforms with embedded AI from AI-first tools. Most event, sales and logistics platforms are not AI-native, and their AI features depend on plan, module and region.' }),
        h('li', { text: 'Company websites and brand portals could not be reached from the research environment. Logos therefore come from official files supplied to RAISE where available and otherwise from open logo libraries that mirror company artwork. Every logo should be checked against the company\'s media kit before external publication.' })),
      h('h2', { class: 'p-h', text: 'Changes and product notes' }),
      h('p', { class: 'p-sub', text: 'Products replaced, renamed or acquired since the starting lists were written, plus notes that change how an entry should be read.' }),
      h('div', { class: 'tbl-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Tool' }), h('th', { text: 'Section' }), h('th', { text: 'Note' }))),
        h('tbody', {}, uniqueChanges.map(([a, b, c]) => h('tr', {}, h('td', { text: a }), h('td', { text: b }), h('td', { text: c })))))),
      h('h2', { class: 'p-h', text: 'Sources' }),
      Object.entries(groups).map(([topic, list]) => [
        h('p', { class: 't-label', style: { marginTop: '22px' }, text: topic }),
        h('div', { class: 'tbl-wrap' }, h('table', {}, h('tbody', {}, list.map((x) => h('tr', {},
          h('td', { text: x.supports }),
          h('td', {}, h('a', { href: x.url, target: '_blank', rel: 'noopener', text: x.title })),
          h('td', {}, h('span', { class: 'tag ' + (x.kind === 'official' ? 'official' : ''), text: x.kind === 'official' ? 'Company source' : 'Dated coverage' })))))))]),
      h('h2', { class: 'p-h', text: 'Logo sources' }),
      h('p', { class: 'p-sub', text: 'Open logo libraries collect company artwork from brand pages and press kits. They are a stand-in until official files are collected; the repository includes a script that pulls each brand\'s own icon from its website.' }),
      h('div', { class: 'tbl-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Brand key' }), h('th', { text: 'Used for' }), h('th', { text: 'Source' }))),
        h('tbody', {}, [...official, ...library].map(([k, m]) => h('tr', {},
          h('td', { text: k }), h('td', { text: m.tools.join(', ') }),
          h('td', {}, m.status === 'official' ? h('span', { class: 'tag official', text: 'Official file' }) : m.source, m.upstream ? [' · upstream ', h('a', { href: m.upstream, target: '_blank', rel: 'noopener', text: 'source' })] : null)))))),
      h('h2', { class: 'p-h', text: `Logos still needed (${missing.length})` }),
      h('p', { class: 'p-sub', text: 'These brands show initials on a dashed plate. Collect the official files from each media kit and drop them into the logos folder.' }),
      h('ul', { class: 'missing-list' }, missing.map(([, m]) => h('li', {}, h('b', { text: m.tools[0] }), m.tools.length > 1 ? ` and ${m.tools.length - 1} more` : '', ` · ${m.company}`))));
    $('#notes').append(page);
  }

  /* ---------- tabs ---------- */
  const views = ['map1', 'map2', 'notes'];
  function show(id) {
    if (!views.includes(id)) id = 'map1';
    for (const v of views) {
      $('#' + v).hidden = v !== id;
      $('#tab-' + v).setAttribute('aria-selected', String(v === id));
    }
    closePop();
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* sandboxed */ }
    if (id !== 'map1') window.scrollTo(0, 0);
    else if (!fitted && WORLD.w) fitAll(true);
  }
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.view)));
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('.tab')];
    const i = tabs.indexOf(document.activeElement);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    n.focus(); n.click();
  });

  /* ---------- start ---------- */
  async function start() {
    const fonts = ['500 15px "Plus Jakarta Sans"', '400 15px "Plus Jakarta Sans"', 'italic 600 56px "Plus Jakarta Sans"', 'italic 500 13px "Plus Jakarta Sans"', '600 14px "Plus Jakarta Sans"', '500 13px "Geist Mono"'];
    try {
      await Promise.race([Promise.all(fonts.map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 3500))]);
    } catch (e) { /* fall back to system fonts */ }
    buildMap1();
    setupSearch();
    buildMap2();
    buildNotes();
    const params = new URLSearchParams(location.search);
    const poster = params.get('poster');
    if (poster) {
      document.body.classList.add('poster');
      if (poster === '1') {
        show('map1');
        Object.assign(view, { s: 1, x: 0, y: 0 }); apply();
        viewport.style.width = WORLD.w + 'px'; viewport.style.height = WORLD.h + 'px';
        document.body.style.width = WORLD.w + 'px';
      } else show(poster === '2' ? 'map2' : 'notes');
      document.body.dataset.ready = 'true';
      return;
    }
    show((location.hash || '#map1').slice(1));
    fitAll(true);
    hintTimer = setTimeout(hideHint, 9000);
    document.body.dataset.ready = 'true';
  }
  window.aiMaps = { focus: (n) => focusSection(n), show: (v) => show(v), fit: () => fitAll(true), view: (x, y, sc) => { Object.assign(view, { x, y, s: sc }); apply(); } };
  start();
})();

</script>
